[build]
  base = "guest-app"
  command = "npm install && npx prisma generate && npm run build && cd ../../netlify/functions && npm install && npx prisma generate"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "../../netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = [
    "@prisma/client",
    ".prisma/client",
    "bcryptjs",
    "jsonwebtoken",
    "uuid"
  ]

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# All API routes go to our single working function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
