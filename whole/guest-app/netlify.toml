[build]
  command = "cd ../shared && npm install && cd ../guest-app && npm install && npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "./netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = [
    "@prisma/client",
    ".prisma/client",
    "bcryptjs",
    "jsonwebtoken",
    "uuid"
  ]

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API route redirects
[[redirects]]
  from = "/api/push/subscribe"
  to = "/.netlify/functions/push-subscribe"
  status = 200

[[redirects]]
  from = "/api/push/send"
  to = "/.netlify/functions/push-send"
  status = 200

[[redirects]]
  from = "/api/auth/staff/login"
  to = "/.netlify/functions/auth-staff-login"
  status = 200

[[redirects]]
  from = "/api/auth/table/session"
  to = "/.netlify/functions/auth-table-session"
  status = 200

[[redirects]]
  from = "/api/auth/refresh"
  to = "/.netlify/functions/auth-refresh"
  status = 200
