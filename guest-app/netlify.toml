[build]
  base = "guest-app"
  command = "npm install && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client"]
  
[[functions."*"]]
  included_files = ["netlify/functions/lib/**", "node_modules/.prisma/**", "node_modules/@prisma/client/**"]

[[redirects]]
  from = "/api/auth/staff/login"
  to = "/.netlify/functions/auth-staff-login"
  status = 200

