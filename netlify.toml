[build]
  base = "whole/guest-app"
  command = "cd ../shared && npm install && cd ../guest-app && npm install && npx prisma generate && npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = [
    "@prisma/client",
    ".prisma/client",
    "bcryptjs",
    "jsonwebtoken",
    "uuid"
  ]

[build.processing]
  skip_processing = false

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

[[redirects]]
  from = "/api/push/subscribe"
  to = "/.netlify/functions/push-subscribe"
  status = 200

